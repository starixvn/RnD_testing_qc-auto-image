docker-build:
  # Official docker image.
  image: docker:latest
  tags:
    - docker-automation-test
  stage: build
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock dslim/docker-slim build qc-auto-image:master
    # - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    # - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  when: manual


