docker-build:
  # Official docker image.
  image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash
  stage: build
  # services:
  #   - docker:dind
  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon-base/qc-auto-image
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
  script:
    # - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock dslim/docker-slim build --http-probe=false git3.nexdev.net:5050/rnd/testing/qc-auto-image:master --continue-after 1
    - docker build 
      --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION-builder
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  tags:
    - docker
